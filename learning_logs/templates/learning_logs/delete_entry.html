{% extends "learning_logs/base.html" %}

{% block page_header %}
  <h2>Delete Entry</h2>
{% endblock page_header %}

{% block content %}
  <p class="fs-5">Are you sure you want to delete this entry from <strong>{{ topic.text }}</strong>?</p>
  
  <div class="card mb-4">
    <div class="card-body text-muted">
      {{ entry.text|linebreaks }}
    </div>
  </div>
  
  <form action="{% url 'learning_logs:delete_entry' entry.id %}" method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete it</button>
    <a href="{% url 'learning_logs:topic' topic.id %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock content %}
